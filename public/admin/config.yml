backend:
  name: github
  repo: ScorpiusWorks/MaduroCigarsClub
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "evenimente"
    label: "Evenimente"
    folder: "src/content/evenimente"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titlu", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Poza principala", name: "coverImage", widget: "image" }
      - {
          label: "Galerie Foto",
          name: "gallery",
          widget: "list",
          field: { label: "Poza", name: "poza", widget: "image" },
        }
      - {
          label: "Descriere (Optional)",
          name: "body",
          widget: "markdown",
          required: false,
        }
